<div class="session-list-container">
    <div class="session-content">
        <h1>Administrador de Sesiones</h1>

        <div class="d-flex d-flex--align-center">
            <mat-form-field appearance="outline">
                <mat-label>Filtrar</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ej. María" #input>
            </mat-form-field>

            <a mat-flat-button routerLink="new">Agregar Sesión</a>
        </div>

        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource" matSort>

                <!-- Nombre -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre de la Sesión</th>
                    <td mat-cell *matCellDef="let row"> {{row.title}} </td>
                </ng-container>

                <!-- Estado -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
                    <td mat-cell *matCellDef="let row"> {{row.status.name}} </td>
                </ng-container>

                <!-- Fecha -->
                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
                    <td mat-cell *matCellDef="let row"> {{row.date + ' ' + row.timeStart}} </td>
                </ng-container>

                <!-- Enviar convocatoria -->
                <ng-container matColumnDef="send">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row">
                    @if (row.status.id !== 3) {
                        <button mat-button color="primary" (click)="sendInvitation(row.id)">Enviar convocatoria</button>
                    } @else {
                        <button mat-button color="accent" (click)="downloadActa(row.id)">DESCARGAR ACTA</button>
                    }

                </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Sin datos -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="4">No hay datos que coincidan con "{{input.value}}"</td>
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccione página de usuarios"></mat-paginator>
        </div>
    </div>
</div>
