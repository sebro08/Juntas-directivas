<router-outlet></router-outlet>

<div class="session-execution-container">
    <div class="page-header">
        <h1>Ejecución de Sesión</h1>
    </div>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- Nombre -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre de la Sesión</th>
                <td mat-cell *matCellDef="let row"> {{row.title}} </td>
            </ng-container>

            <!-- Estado -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
                <td mat-cell *matCellDef="let row"> {{row.status.name}} </td>
            </ng-container>

            <!-- Fecha -->
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
                <td mat-cell *matCellDef="let row"> {{row.date + ' ' + row.timeStart}} </td>
            </ng-container>

            <!-- Configuración (vacía por ahora) -->
            <ng-container matColumnDef="send">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row">
                    <button mat-flat-button color="primary"
                            [disabled]="!isNow(row.date, row.timeStart)"
                            (click)="updateStatusAndExecute(row.id, 2)">
                        Ejecutar
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccione página de usuarios"></mat-paginator>
    </div>

</div>
