<div>
    <h1>Administrador de Usuarios</h1>

    <mat-form-field appearance="outline">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>

    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- User Column -->
            <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
                <td mat-cell *matCellDef="let row"> {{row.firstName + ' ' + row.lastName}} </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
                <td mat-cell *matCellDef="let row"> {{row.email}} </td>
            </ng-container>

            <!-- Role Column -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Rol </th>
                <td mat-cell *matCellDef="let row">
                    <ng-container *ngIf="editedUserId === row.id; else viewRole">
                        <mat-form-field appearance="outline" class="w-100">
                            <mat-select [(value)]="row.role.id">
                                <mat-option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </ng-container>
                    <ng-template #viewRole>
                        {{ row.role?.name }}
                    </ng-template>
                </td>
            </ng-container>
            <!-- Config Column -->
            <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row">
                    <div class="d-center">
                        @if (currentUser !== row.id && row.id !== VISITOR_USER) {
                            <button *ngIf="editedUserId !== row.id && row.id !== VISITOR_USER" mat-icon-button (click)="editUser(row.id)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            @if (editedUserId === row.id) {
                                <button *ngIf="editedUserId === row.id" mat-icon-button color="primary" (click)="saveUserRole(row)">
                                    <mat-icon>check</mat-icon>
                                </button>
                                <button mat-icon-button color="accent" (click)="cancelEdit()">
                                    <mat-icon>cancel</mat-icon>
                                </button>
                            }

                            <button mat-icon-button color="warn" (click)="deleteUser(row.id)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        }
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>
